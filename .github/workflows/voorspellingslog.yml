name: Voorspellingslog

on:
  schedule:
    - cron: '0 5 * * 3-6'
    - cron: '0 17 * * 5'
  workflow_dispatch:

permissions: {}

concurrency:
  group: voorspellingslog
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      # De logbranch staat in log/; bestaat hij nog niet, dan wordt hij een lege orphan-branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: log
          fetch-depth: 0
      - name: Switch log/ to the data branch
        working-directory: log
        run: |
          if git ls-remote --exit-code --heads origin voorspellingslog > /dev/null; then
            git switch voorspellingslog
          else
            git switch --orphan voorspellingslog
            git rm -rf . -q || true
          fi
      - name: Log predictions
        run: node tools/log_voorspellingen.mjs log/voorspellingen.csv
      - name: Commit and push
        working-directory: log
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add voorspellingen.csv
          git commit -m "chore(log): voorspellingen $(date -u +%F)"
          git push origin voorspellingslog
